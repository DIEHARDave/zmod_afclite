[zmod_afclite]

# _AFC_LANE_OP (zmod_afclite.py) runs _AFC_ZMOD_LANE below and reports it as
# AFC's current_state, and a Zmod error (a stalled IFS) as its error_state and
# message. Without LANE, an unload takes the lane in the toolhead.
[gcode_macro CHANGE_TOOL]
description: Load a Zmod lane through the AFC lane interface
gcode:
    _AFC_LANE_OP ACTION=load {'LANE=' ~ params.LANE if params.LANE else ''}

[gcode_macro LANE_UNLOAD]
description: Unload a Zmod lane through the AFC lane interface
gcode:
    _AFC_LANE_OP ACTION=unload {'LANE=' ~ params.LANE if params.LANE else ''}

[gcode_macro TOOL_UNLOAD]
description: Unload a Zmod lane through the AFC lane interface
gcode:
    _AFC_LANE_OP ACTION=unload {'LANE=' ~ params.LANE if params.LANE else ''}

# Load or unload a lane with Zmod's own commands.
#
# AD5X (IFS): IN_ZCOLOR, where NAPR=0 loads and NAPR=1 unloads.
# Creator 5 (toolchanger, total_tools > 1):
#   Load is _T_IN_ZCOLOR NAPR=1 (heats the head and feeds the tube); there
#   NAPR=0 only picks the head up and opens the color dialog. Zmod's load
#   ends on _ENABLE_SENSOR, which leaves only the active head's filament
#   sensor on. That is Zmod's printing setup: with the other heads' sensors
#   off, inserting filament there opens no dialog. When no print is running,
#   _DISABLE_SENSOR puts back Zmod's idle setup (all four head sensors on),
#   the same as Zmod's own end of print.
#   Unload: the filament is cut at the head and pulled out by hand, so there
#   is nothing for the printer to do. The AFC panel in Mainsail and Fluidd
#   still offers an Unload button on every loaded lane (and Eject, which it
#   keeps disabled there), so both explain that instead of moving anything.
[gcode_macro _AFC_ZMOD_LANE]
gcode:
    {% set lane = printer['AFC_lane ' ~ params.LANE|string] %}
    {% set slot = lane.zmod_slot|int %}
    {% set unload = params.ACTION|default('load')|lower == 'unload' %}
    {% if printer.zmod_color.total_tools|default(1)|int > 1 %}
        {% if unload %}
            RESPOND PREFIX="info" MSG="T{slot - 1}: the Creator 5 has no automatic unload. Cut the filament at the head and pull it out by hand."
            RESPOND TYPE=command MSG="action:prompt_begin Unload T{slot - 1}"
            RESPOND TYPE=command MSG="action:prompt_text The Creator 5 has no automatic unload."
            RESPOND TYPE=command MSG="action:prompt_text Cut the filament at the head and pull it out by hand."
            RESPOND TYPE=command MSG="action:prompt_footer_button OK|RESPOND TYPE=command MSG=action:prompt_end|primary"
            RESPOND TYPE=command MSG="action:prompt_show"
        {% else %}
            _T_IN_ZCOLOR SLOT={slot} NAPR=1
            {% if printer.print_stats.state not in ['printing', 'paused'] %}
                _DISABLE_SENSOR
            {% endif %}
        {% endif %}
    {% else %}
        IN_ZCOLOR SLOT={slot} NAPR={1 if unload else 0}
    {% endif %}

# Klipper strips everything after '#' as a comment, even inside Jinja strings,
# so the macros below spell it as the escape '\x23'.
[gcode_macro SET_COLOR]
description: Update the Zmod lane color
# After the color is applied, the material picker opens so the filament dialog
# never needs a typed material. A SET_MATERIAL with an exact material sent
# right after (from the same dialog) closes it again. Set
# variable_material_prompt: False in user.cfg to turn this off.
variable_material_prompt: True
gcode:
    {% set lane_name = params.LANE|default('E0')|string %}
    {% set lane = printer['AFC_lane ' ~ lane_name] %}
    {% set color = params.COLOR|default('')|replace('\x23', '')|upper %}
    {% if color|length == 8 %}
        {% set color = color[:6] %}
    {% endif %}
    # HelixScreen clears a lane with an empty SET_MATERIAL, SET_COLOR and
    # SET_WEIGHT WEIGHT=0. Zmod always keeps a color and material per slot, so
    # an empty COLOR leaves the slot as it is.
    {% if color|length == 0 %}
        RESPOND PREFIX="info" MSG="{lane.name}: no color given, Zmod keeps the slot color."
    {% elif color|length != 6 %}
        { action_raise_error("COLOR must be 6-digit RGB or 8-digit RGBA hex.") }
    {% else %}
        # Mainsail and Fluidd send SET_COLOR before SET_MATERIAL; for a slot
        # without a material, Zmod treats TYPE=? as its default (PLA).
        {% set material = lane.material %}
        {% if material in ['NONE', 'N/A', '?', ''] %}
            {% set material = '?' %}
        {% endif %}
        # _AFC_SET_ZCOLOR snaps the color to the Creator 5's palette and calls
        # CHANGE_ZCOLOR without opening Zmod's color picker.
        _AFC_SET_ZCOLOR SLOT={lane.zmod_slot} HEX={color} TYPE={material}
        {% if printer['gcode_macro SET_COLOR'].material_prompt %}
            _AFC_MATERIAL_PROMPT LANE={lane.name}
        {% endif %}
    {% endif %}

[gcode_macro SET_MATERIAL]
description: Update the Zmod lane material, or pick it from the printer's list
# The AFC filament dialog in Mainsail and Fluidd has a free-text material box.
# An exact match (any case) is applied; anything else opens a prompt listing
# the matching materials, or all of them, from Zmod's valid_types: the built-in
# types plus custom [zmod_ifs] filament_<NAME> entries, minus hidden ones.
gcode:
    {% set lane_name = params.LANE|default('E0')|string %}
    {% set lane = printer['AFC_lane ' ~ lane_name] %}
    {% set material = params.MATERIAL|default('')|string|upper|trim %}
    {% set color = lane.color|replace('\x23', '') %}
    {% if params.SUBTYPE|default('')|string|length > 0 %}
        { action_raise_error("Zmod does not support AFC material subtypes.") }
    {% endif %}
    {% if params.VENDOR|default('')|string|length > 0 %}
        { action_raise_error("Zmod does not store AFC filament vendors.") }
    {% endif %}
    {% set valid = printer.zmod_color.valid_types|default([]) %}
    {% if not material %}
        # An empty MATERIAL is HelixScreen clearing the lane (see SET_COLOR).
        # Zmod keeps the slot's material; SET_COLOR still offers the picker.
        RESPOND PREFIX="info" MSG="{lane.name}: no material given, Zmod keeps the slot material."
    {% elif material in valid and material != '?' %}
        _AFC_SET_ZCOLOR SLOT={lane.zmod_slot} HEX={color} TYPE={material}
    {% else %}
        _AFC_MATERIAL_PROMPT LANE={lane.name} MATERIAL={material}
    {% endif %}

[gcode_macro _AFC_MATERIAL_PROMPT]
description: Show the printer's materials as buttons for an AFC lane
# MATERIAL (optional) narrows the list to names containing it; with no match,
# or none given, every material is listed. The footer keeps the current one.
gcode:
    {% set lane = printer['AFC_lane ' ~ params.LANE|default('E0')|string] %}
    {% set material = params.MATERIAL|default('')|string|upper|trim %}
    {% set valid = printer.zmod_color.valid_types|default([]) %}
    {% set hidden = printer.zmod_color.hidden_types|default([]) %}
    {% set current = lane.material if lane.material in valid and lane.material != '?' else '' %}
    # Klipper's Jinja has no "do" extension, so lists are built by
    # assignment through a namespace.
    {% set ns = namespace(options=[], matches=[]) %}
    {% for type in valid %}
        {% if type != '?' and type not in hidden %}
            {% set ns.options = ns.options + [type] %}
            {% if material and material != '?' and material in type %}
                {% set ns.matches = ns.matches + [type] %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% set matches = ns.matches %}
    {% set options = matches if matches else ns.options %}
    RESPOND TYPE=command MSG="action:prompt_begin Material for {lane.name}"
    {% if material and material != '?' and not matches %}
        RESPOND TYPE=command MSG="action:prompt_text {material} is not a material this printer knows. Pick one:"
    {% elif current %}
        RESPOND TYPE=command MSG="action:prompt_text Pick the material for {lane.name} (currently {current}):"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_text Pick the material for {lane.name}:"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for type in options %}
        RESPOND TYPE=command MSG="action:prompt_button {type}|SET_MATERIAL LANE={lane.name} MATERIAL={type}|primary"
        {% if loop.index % 4 == 0 and not loop.last %}
            RESPOND TYPE=command MSG="action:prompt_button_group_end"
            RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% if current %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Keep {current}|RESPOND TYPE=command MSG=action:prompt_end"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro SET_VENDOR]
gcode:
    { action_raise_error("Zmod does not store AFC filament vendors.") }

[gcode_macro SET_MAP]
gcode:
    { action_raise_error("Zmod maps tools per print. Use its COLOR workflow instead.") }

[gcode_macro SET_WEIGHT]
description: Set the filament weight shown for an AFC lane
# Zmod does not measure filament; this only stores what the user entered, in
# save_variables under zmod_afclite_weight_<lane> (see WEIGHT_VARIABLE_PREFIX).
gcode:
    {% set lane_name = params.LANE|default('E0')|string|upper %}
    {% set lane = printer['AFC_lane ' ~ lane_name] %}
    {% set weight = params.WEIGHT|default(-1)|float %}
    {% if weight < 0 %}
        { action_raise_error("WEIGHT must be a weight in grams (0 or more).") }
    {% endif %}
    {% if 'save_variables' in printer %}
        # WEIGHT=0 is how AFC (and HelixScreen's lane clear) empties a lane. It
        # goes back to the default weight, because Mainsail's filament dialog
        # keeps Set disabled for a lane that reports no weight.
        SAVE_VARIABLE VARIABLE=zmod_afclite_weight_{lane_name|lower} VALUE={weight|round|int if weight > 0 else 'None'}
    {% else %}
        RESPOND PREFIX="info" MSG="No [save_variables] configured, so the lane weight was not saved."
    {% endif %}
