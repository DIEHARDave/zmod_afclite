[zmod_afclite]

[gcode_macro CHANGE_TOOL]
description: Load a Zmod IFS slot through the AFC lane interface
gcode:
    {% set lane_name = params.LANE|default('E0')|string %}
    {% set lane = printer['AFC_lane ' ~ lane_name] %}
    IN_ZCOLOR SLOT={lane.zmod_slot} NAPR=0

[gcode_macro LANE_UNLOAD]
description: Unload a Zmod IFS slot through the AFC lane interface
gcode:
    {% set lane_name = params.LANE|default('E0')|string %}
    {% set lane = printer['AFC_lane ' ~ lane_name] %}
    IN_ZCOLOR SLOT={lane.zmod_slot} NAPR=1

[gcode_macro TOOL_UNLOAD]
description: Unload a Zmod IFS slot through the AFC lane interface
gcode:
    {% set lane_name = params.LANE|default('E0')|string %}
    {% set lane = printer['AFC_lane ' ~ lane_name] %}
    IN_ZCOLOR SLOT={lane.zmod_slot} NAPR=1

# Klipper strips everything after '#' as a comment, even inside Jinja strings,
# so the macros below spell it as the escape '\x23'.
[gcode_macro SET_COLOR]
description: Update the Zmod IFS slot color
gcode:
    {% set lane_name = params.LANE|default('E0')|string %}
    {% set lane = printer['AFC_lane ' ~ lane_name] %}
    {% set color = params.COLOR|default('')|replace('\x23', '')|upper %}
    {% if color|length == 8 %}
        {% set color = color[:6] %}
    {% endif %}
    {% if color|length != 6 %}
        { action_raise_error("COLOR must be 6-digit RGB or 8-digit RGBA hex.") }
    {% endif %}
    {% if lane.material in ['NONE', 'N/A', '?', ''] %}
        { action_raise_error("Set the slot material before changing its color.") }
    {% endif %}
    CHANGE_ZCOLOR SLOT={lane.zmod_slot} HEX={color} TYPE={lane.material}

[gcode_macro SET_MATERIAL]
description: Update the Zmod IFS slot material
gcode:
    {% set lane_name = params.LANE|default('E0')|string %}
    {% set lane = printer['AFC_lane ' ~ lane_name] %}
    {% set material = params.MATERIAL|default('PLA')|upper %}
    {% set color = lane.color|replace('\x23', '') %}
    {% if params.SUBTYPE|default('')|string|length > 0 %}
        { action_raise_error("Zmod does not support AFC material subtypes.") }
    {% endif %}
    {% if params.VENDOR|default('')|string|length > 0 %}
        { action_raise_error("Zmod does not store AFC filament vendors.") }
    {% endif %}
    CHANGE_ZCOLOR SLOT={lane.zmod_slot} HEX={color} TYPE={material}

[gcode_macro SET_VENDOR]
gcode:
    { action_raise_error("Zmod does not store AFC filament vendors.") }

[gcode_macro SET_MAP]
gcode:
    { action_raise_error("Zmod maps tools per print. Use its COLOR workflow instead.") }

[gcode_macro SET_SPOOL_ID]
gcode:
    { action_raise_error("Zmod AFC Lite does not provide spool IDs or Spoolman.") }

[gcode_macro SET_WEIGHT]
# Mainsail's filament dialog requires a weight and always sends SET_WEIGHT
# after SET_COLOR/SET_MATERIAL, so ignore it rather than failing the change.
gcode:
    RESPOND PREFIX="info" MSG="Zmod AFC Lite does not track spool weight; ignored."
